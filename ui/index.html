<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCT Nexus</title>
<style>
  :root{
    --amethyst:#3B0A6B; --purple:#8b5cf6; --purple-2:#b794ff; --blue:#3b82f6; --blue-2:#6d8dff;
    --bg:#ffffff; --panel:#100d2e; --panel-2:#14103a; --line:#2a2362; --ink:#1b1840; --muted:#9aa3d0;
    --ok:#5df2a4; --err:#ff8a80; --errbg:#2b1318;
    --grad:linear-gradient(120deg,#3B0A6B 0%,#4a22b8 55%,#2563eb 100%);
    --side:272px;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;
       background:#ffffff}
  button{font:inherit}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:30;background:var(--grad);color:#fff;box-shadow:0 6px 28px rgba(59,10,107,.55)}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
        background:linear-gradient(90deg,transparent,#6d8dff,#b794ff,transparent)}
  .head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .menu{display:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;
        width:38px;height:38px;cursor:pointer;font-size:18px}
  .logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:21px;
        background:linear-gradient(145deg,#ffffff,#d9e4ff);color:var(--amethyst);
        box-shadow:0 0 0 3px rgba(255,255,255,.2),0 0 24px rgba(109,141,255,.9)}
  h1{font-size:20px;margin:0;font-weight:750;line-height:1.1}
  .sub{font-size:12px;opacity:.85;letter-spacing:.6px;text-transform:uppercase}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-size:12px;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 11px;background:rgba(255,255,255,.12)}
  .live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);
        margin-right:6px;box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- sidebar ---------- */
  aside{position:fixed;top:68px;bottom:0;left:0;width:var(--side);z-index:25;display:flex;flex-direction:column;
        background:rgba(16,13,46,.92);border-right:1px solid var(--line);backdrop-filter:blur(8px);padding:14px 12px;gap:10px}
  .newchat{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px;cursor:pointer;
        color:#fff;font-weight:700;background:var(--grad);box-shadow:0 8px 22px rgba(74,34,184,.45);transition:transform .15s}
  .newchat:hover{transform:translateY(-2px)}
  .side-title{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:8px 4px 0}
  #history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin:0 -4px;padding:0 4px}
  #history::-webkit-scrollbar{width:6px}#history::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
  .empty{color:var(--muted);font-size:13.5px;padding:8px 6px}
  .item{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:11px;padding:8px 8px 8px 11px;cursor:pointer;
        color:#cdd6ff;font-size:14px;transition:all .15s}
  .item:hover{background:var(--panel-2);border-color:var(--line)}
  .item.active{background:linear-gradient(120deg,rgba(59,10,107,.75),rgba(37,99,235,.35));border-color:#5b44b8}
  .item span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .del{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;padding:2px 6px;opacity:0;font-size:15px}
  .item:hover .del{opacity:1}.item .del:hover{color:var(--err);background:rgba(255,138,128,.12)}
  .clear{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:9px;cursor:pointer;transition:all .15s}
  .clear:hover{color:var(--err);border-color:var(--err);background:rgba(255,138,128,.08)}

  /* ---------- main ---------- */
  .page{margin-left:var(--side);--panel-2:#ffffff;--line:#dfe3f6;--muted:#5b6490;--err:#b42318;--errbg:#fdecea}
  .wrap{max-width:820px;margin:0 auto;padding:0 20px}
  main{padding:24px 0 160px}
  .warn{background:var(--errbg);color:var(--err);padding:9px 13px;border-radius:10px;margin-bottom:14px;font-size:14px;display:none}
  .hero{text-align:center;padding:24px 0 6px}
  .hero h2{font-size:40px;line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.5px;
           background:linear-gradient(100deg,#6d3fd1,#3b5bdb);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:0 auto;max-width:560px;color:var(--muted);font-size:17px}
  .hero.small{padding:0 0 4px}.hero.small h2{font-size:22px}.hero.small p{display:none}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:20px 0 26px}
  .chip{font-size:14px;cursor:pointer;color:#3b2f9a;background:var(--panel-2);border:1px solid #b9c3f5;border-radius:999px;padding:7px 14px;transition:all .18s}
  .chip:hover{transform:translateY(-2px);color:#fff;border-color:var(--purple);background:linear-gradient(120deg,#3B0A6B,#2563eb);box-shadow:0 8px 22px rgba(139,92,246,.35)}

  .msg{margin:0 0 24px;animation:rise .35s ease}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .qrow{display:flex;justify-content:flex-end;margin-bottom:11px}
  .q{background:var(--grad);color:#fff;padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:85%;box-shadow:0 8px 22px rgba(74,34,184,.4)}
  .arow{display:flex;gap:12px;align-items:flex-start}
  .av{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--grad);
      box-shadow:0 0 16px rgba(109,141,255,.6)}
  .a{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:15px 18px;
     box-shadow:0 6px 24px rgba(59,10,107,.10);position:relative;overflow:hidden}
  .a::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--purple),var(--blue))}
  .a .text{white-space:pre-wrap;word-wrap:break-word}
  .a .text b{color:#5b2fc9;font-weight:650}
  .a .text.streaming::after{content:"";display:inline-block;width:8px;height:1.05em;margin-left:3px;vertical-align:-3px;
        background:linear-gradient(var(--purple),var(--blue));border-radius:2px;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  .typing{display:flex;gap:5px;padding:6px 0}
  .typing i{width:9px;height:9px;border-radius:50%;background:linear-gradient(var(--purple),var(--blue));animation:bounce 1.1s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes bounce{0%,80%,100%{transform:scale(.55);opacity:.4}40%{transform:scale(1);opacity:1}}
  .err{background:var(--errbg);color:var(--err);border-radius:10px;padding:9px 13px;margin-top:9px;font-size:14px}
  .meta{margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
  .meta span{background:#eef0ff;border-radius:999px;padding:2px 10px}
  .meta b{color:#5b2fc9;font-weight:700}
  details{margin-top:12px;border-top:1px dashed var(--line);padding-top:9px}
  summary{cursor:pointer;font-size:13.5px;color:#3b4fb8;font-weight:600}
  summary:hover{color:#5b2fc9}
  .src{margin:10px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .src h4{margin:0;padding:8px 13px;font-size:13px;font-weight:650;background:#eef0ff;color:#4a2db5;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .src h4 span{font-weight:400;color:var(--muted)}
  .src pre{margin:0;padding:11px 13px;white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#2a2f55}

  /* ---------- input bar ---------- */
  form{position:fixed;left:var(--side);right:0;bottom:0;padding:14px 0 10px;z-index:15;background:linear-gradient(to top,#ffffff 70%,rgba(255,255,255,0))}
  .bar{display:flex;gap:10px}
  input{flex:1;min-width:0;font:inherit;padding:14px 18px;border-radius:16px;border:1.5px solid #b9c3f5;background:var(--panel-2);color:var(--ink);
        box-shadow:0 6px 22px rgba(59,10,107,.12);transition:all .2s}
  input::placeholder{color:#8a92c0}
  input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(139,92,246,.2),0 0 28px rgba(59,130,246,.35)}
  button.send{font-weight:700;border:0;border-radius:16px;padding:0 26px;cursor:pointer;color:#fff;background:var(--grad);
        box-shadow:0 8px 24px rgba(74,34,184,.55);transition:all .2s}
  button.send:hover{transform:translateY(-2px)}button.send:disabled{opacity:.55;cursor:default;transform:none}
  .foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:8px}

  .scrim{display:none}
  @media (max-width:860px){
    .menu{display:block}
    aside{transform:translateX(-100%);transition:transform .25s;top:0;padding-top:78px;width:280px}
    body.open aside{transform:none}
    body.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20}
    .page{margin-left:0}form{left:0}
    .hero h2{font-size:30px}.badges{display:none}
  }
</style>
</head>
<body>
<header><div class="wrap head" style="max-width:none">
  <div class="brand">
    <button class="menu" id="menu" aria-label="Open history">☰</button>
    <div class="logo">N</div>
    <div><h1>BCT Nexus</h1><div class="sub">HR Policy Assistant</div></div>
  </div>
  <div class="badges" id="badges"></div>
</div></header>

<aside>
  <button class="newchat" id="newchat">＋ New chat</button>
  <div class="side-title">History</div>
  <div id="history"></div>
  <button class="clear" id="clear">Clear history</button>
</aside>
<div class="scrim" id="scrim"></div>

<div class="page">
<main class="wrap">
  <div class="warn" id="warn"></div>
  <section class="hero" id="hero">
    <h2>Hello, BCTians! 👋</h2>
    <p>I’m BCT Nexus. Ask me about attendance, regularization, timecards, claims or the 5-day work week. I answer only from your HR documents.</p>
  </section>
  <div class="chips" id="chips"></div>
  <div id="chat"></div>
</main>

<form id="form"><div class="wrap">
  <div class="bar">
    <input id="input" autocomplete="off" placeholder="Ask BCT Nexus about your HR policies…" autofocus>
    <button class="send" id="send">Ask ➤</button>
  </div>
  <div class="foot">BCT Nexus answers only from the official HR policy documents. History is saved in this browser only.</div>
</div></form>
</div>

<script>
const EXAMPLES = [
  "What is the payroll cut-off date?",
  "Who is eligible for the 5 day work week?",
  "What happens to days that are not regularized?",
  "When should I use Forgot ID card?",
  "What is the claim approval flow?",
  "How many casual leaves do I get in a year?"
];
const KEY = "bct_nexus_history";
const $ = s => document.querySelector(s);
const chat = $("#chat"), input = $("#input"), sendBtn = $("#send"), hist = $("#history");

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^\s*[-*]\s+/gm,"• "); }

let convs = [];
try { convs = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { convs = []; }
let current = null;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(convs.slice(0, 40))); } catch(e) {} }

/* ---------- sidebar ---------- */
function renderSidebar(){
  hist.innerHTML = "";
  if(!convs.length){ hist.innerHTML = '<div class="empty">No chats yet. Ask your first question.</div>'; return; }
  convs.forEach(c => {
    const d = document.createElement("div");
    d.className = "item" + (current && current.id === c.id ? " active" : "");
    d.innerHTML = `<span title="${esc(c.title)}">💬 ${esc(c.title)}</span><button class="del" title="Delete" aria-label="Delete chat">✕</button>`;
    d.onclick = () => openConv(c.id);
    d.querySelector(".del").onclick = e => { e.stopPropagation(); deleteConv(c.id); };
    hist.appendChild(d);
  });
}
function showHero(small){ $("#hero").classList.toggle("small", small); $("#chips").style.display = small ? "none" : "flex"; }
function newChat(){ current = null; chat.innerHTML = ""; showHero(false); renderSidebar(); closeSide(); input.focus(); }
function openConv(id){
  current = convs.find(c => c.id === id); if(!current) return;
  chat.innerHTML = ""; showHero(true);
  current.items.forEach(it => {
    const m = addMessage(it.q, false);
    m.text.innerHTML = fmt(it.a);
    if(it.sources && it.sources.length) addSources(m.card, it.sources);
    if(it.total != null) setMeta(m.meta, it.ms, it.first, it.total);
  });
  renderSidebar(); closeSide(); window.scrollTo(0, 0);
}
function deleteConv(id){
  convs = convs.filter(c => c.id !== id); save();
  if(current && current.id === id) newChat(); else renderSidebar();
}
$("#clear").onclick = () => {
  if(!convs.length) return;
  if(confirm("Clear all chat history?")){ convs = []; save(); newChat(); }
};
$("#newchat").onclick = newChat;
function closeSide(){ document.body.classList.remove("open"); }
$("#menu").onclick = () => document.body.classList.toggle("open");
$("#scrim").onclick = closeSide;

/* ---------- examples + status ---------- */
EXAMPLES.forEach(q => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.textContent = q;
  b.onclick = () => ask(q);
  $("#chips").appendChild(b);
});
fetch("/info").then(r => r.json()).then(i => {
  $("#badges").innerHTML = [i.provider + " / " + i.model, i.search, i.chunks + " chunks"]
    .map((t, n) => `<span class="badge${n === 0 ? " live" : ""}">${esc(t)}</span>`).join("");
  if(!i.has_key){
    const w = $("#warn"); w.style.display = "block";
    w.textContent = "No API key found. Add it to the .env file and restart server.py.";
  }
});
$("#form").addEventListener("submit", e => { e.preventDefault(); ask(input.value); });

/* ---------- message pieces ---------- */
function addMessage(question, withTyping){
  const wrap = document.createElement("div");
  wrap.className = "msg";
  wrap.innerHTML = `<div class="qrow"><div class="q">${esc(question)}</div></div>
    <div class="arow"><div class="av">N</div>
    <div class="a">${withTyping ? '<div class="typing"><i></i><i></i><i></i></div>' : ""}<div class="text${withTyping ? " streaming" : ""}"></div><div class="meta"></div></div></div>`;
  chat.appendChild(wrap);
  return {wrap, text: wrap.querySelector(".text"), meta: wrap.querySelector(".meta"),
          card: wrap.querySelector(".a"), typing: wrap.querySelector(".typing")};
}
function addSources(card, sources){
  const d = document.createElement("details");
  d.innerHTML = `<summary>Sources used (${sources.length})</summary>` + sources.map((s,i) => `
    <div class="src"><h4>[${i+1}] ${esc(s.doc_title)} &rsaquo; ${esc(s.section)}
      <span>keyword ${s.bm25}${s.vector!==null && s.vector!==undefined ? " · meaning " + s.vector : ""}</span></h4>
      <pre>${esc(s.text)}</pre></div>`).join("");
  card.appendChild(d);
}
function setMeta(meta, ms, first, total){
  const f = first ? Number(first).toFixed(2) + " s" : "-";
  meta.innerHTML = `<span>Search <b>${ms} ms</b></span><span>First word <b>${f}</b></span><span>Total <b>${Number(total).toFixed(2)} s</b></span>`;
}

/* ---------- ask ---------- */
async function ask(question){
  question = question.trim();
  if(!question || sendBtn.disabled) return;
  input.value = ""; sendBtn.disabled = true; showHero(true); closeSide();

  if(!current){
    current = {id: Date.now(), title: question.length > 38 ? question.slice(0, 38) + "…" : question, items: []};
    convs.unshift(current);
  }
  const entry = {q: question, a: "", sources: [], ms: null, first: null, total: null};
  current.items.push(entry);
  renderSidebar();

  const m = addMessage(question, true);
  const {text, meta, card} = m;
  let typing = m.typing;
  const stopTyping = () => { if(typing && typing.parentNode) typing.remove(); };
  window.scrollTo(0, document.body.scrollHeight);

  try{
    const res = await fetch("/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({question})});
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while(true){
      const {value, done} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      let nl;
      while((nl = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
        if(!line) continue;
        const ev = JSON.parse(line);
        if(ev.type === "sources"){
          entry.ms = ev.retrieval_ms; entry.sources = ev.sources;
          addSources(card, ev.sources);
        } else if(ev.type === "token"){
          stopTyping();
          entry.a += ev.text; text.innerHTML = fmt(entry.a);
          window.scrollTo(0, document.body.scrollHeight);
        } else if(ev.type === "error"){
          stopTyping();
          const d = document.createElement("div"); d.className = "err"; d.textContent = ev.message;
          card.insertBefore(d, meta);
        } else if(ev.type === "done"){
          entry.first = ev.first_token_s; entry.total = ev.total_s;
          setMeta(meta, entry.ms, entry.first, entry.total);
        }
      }
    }
  }catch(err){
    stopTyping();
    const d = document.createElement("div"); d.className = "err";
    d.textContent = "Could not reach the server: " + err; card.insertBefore(d, meta);
  }
  stopTyping();
  text.classList.remove("streaming");
  save(); renderSidebar();
  sendBtn.disabled = false; input.focus();
}

renderSidebar();
</script>
</body>
</html>
